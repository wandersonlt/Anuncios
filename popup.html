<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">

    <header class="head">
      <div class="logo">📅</div>
      <div>
        <h1>Data do Anúncio</h1>
        <p>Mercado Livre</p>
      </div>
    </header>

    <div class="card">
      <div class="row">
        <div>
          <div class="row-title">Extensão</div>
          <div class="row-sub" id="statusText">Desativada</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggleExtensao" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button id="btnVerificar" class="btn" disabled>Verificar agora</button>

    <div id="resultado" class="result hidden">
      <div class="result-label">Publicado em</div>
      <div id="dataEncontrada" class="result-value">—</div>
      <div id="fonte" class="result-meta">—</div>
    </div>

    <p class="hint">
      Com a extensão ativa, um <b>ícone de calendário</b> aparece ao lado
      do carrinho no header do Mercado Livre. Ao trocar de produto, a data
      é relida automaticamente.
    </p>

  </div>
  <script src="popup.js"></script>
</body>
</html>
